name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - 'main'

jobs:
  test:
    name: Code Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read # 最小权限原则，仅需读取代码即可

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          
      - name: Verify Code Format
        run: |
          go vet ./...
          go fmt ./...
        
      - name: Test Build
        run: |
          go build -o /dev/null ./cmd/sbctl
