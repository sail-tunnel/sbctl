name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - 'main'

jobs:
  test:
    name: Code Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read # 最小权限原则，仅需读取代码即可

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Verify Code Format
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            echo "Please run 'go fmt ./...' to format the code"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run Tests
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Test Build
        run: |
          go build -v ./...
          go build -o /dev/null ./cmd/sbctl
