name: Release sbctl

on:
  push:
    tags:
      - 'v*' # 当推送形如 v2.0.0 的 tag 时触发构建

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许创建 Release 并上传二进制文件
    
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64, arm]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          
      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          go build -ldflags="-s -w -X main.version=${VERSION}" -o sbctl-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/sbctl

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: sbctl-${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
